name: Uji

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uji pemeriksa kata dan irama
        run: python3 -m unittest discover -s tests -v
      - name: Uji mandiri pemeriksa inti
        run: python3 skills/bahasa-inti/scripts/ritme.py --tes
      - name: Uji pemeriksa akademik
        run: |
          python3 skills/bahasa-peneliti/scripts/periksa.py --tes
          python3 skills/bahasa-peneliti/scripts/periksa.py --validasi
          python3 skills/bahasa-peneliti/evals/jalankan.py --tes
      - name: Validasi JSON
        run: |
          python3 -c "import json; [json.load(open(f, encoding='utf-8')) for f in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', '.mcp.json', 'skills/bahasa-peneliti/evals/cases.json']]"
